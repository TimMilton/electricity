# «Електрооблік будинку» — повний стек в Docker:
#   gateway  — Caddy: єдина точка входу (HTTP локально або HTTPS з доменом)
#   app      — вебзастосунок (Next.js)
#   db       — PostgreSQL (образ Supabase)
#   auth     — Supabase Auth (GoTrue): облікові записи квартир і адміністраторів
#   rest     — PostgREST: доступ застосунку до бази з RLS
#   storage  — Supabase Storage: приватне сховище квитанцій
#   migrate  — одноразово застосовує міграції застосунку
#   cron     — щоденна системна задача (розрахункові періоди)
#
# Мешканці входять за номером квартири та кодом доступу від адміністратора —
# пошта й листи не використовуються.
#
# Перший запуск:
#   node docker/init-env.mjs          # або без Node — див. README
#   docker compose up -d --build
#   docker compose exec app node scripts/create-admin.mjs --email you@example.com
#   (далі адміністратор видає коди доступу квартирам у розділі «Квартири»)
#
# Усі змінні — у файлі .env (створює docker/init-env.mjs за зразком .env.docker.example).

name: elektrooblik

x-supabase-jwt: &supabase-jwt
  JWT_SECRET: ${JWT_SECRET:?Створіть .env командою node docker/init-env.mjs}

services:
  gateway:
    image: ${CADDY_IMAGE:-caddy:2.10.0-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-elektrooblik-app:local}
    restart: unless-stopped
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SUPABASE_ANON_KEY: ${ANON_KEY:?Створіть .env командою node docker/init-env.mjs}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Створіть .env командою node docker/init-env.mjs}
      SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      CRON_SECRET: ${CRON_SECRET:?Створіть .env командою node docker/init-env.mjs}
      ENABLE_PREVIEW: ${ENABLE_PREVIEW:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started

  db:
    image: ${SUPABASE_POSTGRES_IMAGE:-supabase/postgres:15.8.1.060}
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      <<: *supabase-jwt
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?Створіть .env командою node docker/init-env.mjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Створіть .env командою node docker/init-env.mjs}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init-scripts/99-elektrooblik.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: ${SUPABASE_AUTH_IMAGE:-supabase/gotrue:v2.176.1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:-http://localhost:8080}/**
      # Самостійної реєстрації немає: облікові записи квартир створює сервер застосунку
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Листи не надсилаються: облікові записи створюються одразу підтвердженими
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  rest:
    image: ${POSTGREST_IMAGE:-postgrest/postgrest:v12.2.12}
    restart: unless-stopped
    command: ["postgrest"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}

  storage:
    image: ${SUPABASE_STORAGE_IMAGE:-supabase/storage-api:v1.24.7}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: ${SUPABASE_POSTGRES_IMAGE:-supabase/postgres:15.8.1.060}
    restart: "no"
    entrypoint: ["bash", "/docker/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/migrate.sh:/docker/migrate.sh:ro
      - ./supabase/migrations:/migrations:ro

  cron:
    image: ${ALPINE_IMAGE:-alpine:3.22}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
    # Щоденна задача ідемпотентна, тому запускається при старті й далі кожні 6 годин
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          if wget -q -O - --header="Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/periods; then
            echo " — розрахункові періоди перевірено"
          else
            echo "помилка виклику /api/cron/periods"
          fi
          sleep 21600
        done

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
